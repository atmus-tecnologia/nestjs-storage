name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        nest: [11, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test supported Nest major
        if: matrix.nest == 11
        run: npm install --no-save @nestjs/common@11 @nestjs/core@11 @nestjs/testing@11 @nestjs/config@4
      - run: npm run check
